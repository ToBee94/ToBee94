<svg xmlns="http://www.w3.org/2000/svg" width="400" height="212" viewBox="0 0 400 212" role="img" aria-label="Mumcord/mumpeer: Small relay for Mumcord's peer-to-peer features like screen sharing. Hides IPs, only verified Mumcord/Mumble users get in.">
<defs>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a8b"/><stop offset="1" stop-color="#8b6cff"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a8b" stop-opacity=".55"/><stop offset=".45" stop-color="#30363d"/><stop offset="1" stop-color="#30363d"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<clipPath id="c"><rect width="400" height="212" rx="16"/></clipPath>
</defs>
<style>
.sheen{animation:sheen 8s ease-in-out infinite;animation-delay:1.5s}
@keyframes sheen{0%{transform:translateX(-260px) skewX(-20deg)}35%,100%{transform:translateX(560px) skewX(-20deg)}}
.glow{animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.22}to{opacity:.45}}
</style>
<g clip-path="url(#c)">
<rect width="400" height="212" fill="#0d1117"/>
<circle class="glow" cx="370" cy="10" r="90" fill="#ff9a8b" filter="url(#blur)"/>
<rect width="400" height="3" fill="url(#bar)"/>
<rect class="sheen" x="0" y="0" width="140" height="212" fill="url(#sheen)"/>
<text x="26" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#7d8590">Mumcord /</text>
<text x="25" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">mumpeer</text>
<rect x="316" y="26" width="62" height="22" rx="11" fill="#ff9a8b" fill-opacity=".14" stroke="#ff9a8b" stroke-opacity=".5"/>
<text x="347" y="41" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#ff9a8b">RELAY</text>
<text x="26" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9da7b3">Small relay for Mumcord's peer-to-peer features</text><text x="26" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9da7b3">like screen sharing. Hides IPs, only verified</text><text x="26" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#9da7b3">Mumcord/Mumble users get in.</text>
<text x="26" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8590">Coming soon</text>
</g>
<rect x=".5" y=".5" width="399" height="211" rx="16" fill="none" stroke="url(#edge)"/>
</svg>