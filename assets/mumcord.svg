<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Mumcord: modern voice chat for any Mumble server">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0819"/><stop offset=".6" stop-color="#170f2e"/><stop offset="1" stop-color="#241327"/></linearGradient>
<linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d4c8ff"/><stop offset="1" stop-color="#ff9a8b"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cff" stop-opacity=".8"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#ff9a8b" stop-opacity=".8"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".06"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
<clipPath id="frame"><rect width="1200" height="440" rx="26"/></clipPath>
<clipPath id="win"><rect x="680" y="44" width="480" height="352" rx="16"/></clipPath>
</defs>
<style>
.hex{fill-opacity:.03;stroke-opacity:.18;stroke-width:1.5;animation:pulse 6s ease-in-out infinite}
.hex.idle{animation:none}
@keyframes pulse{0%,100%{fill-opacity:.03;stroke-opacity:.18}50%{fill-opacity:.32;stroke-opacity:.9}}
.blob{transform-box:fill-box;transform-origin:center;animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-30px) scale(1.15)}100%{transform:translate(-50px,25px) scale(.92)}}
.in{opacity:0;animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.talk{transform-box:fill-box;transform-origin:center;animation:talk 1.4s ease-in-out infinite}
@keyframes talk{0%,100%{opacity:.25;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
.dot{animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.float{animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.wave{transform-box:fill-box;transform-origin:center bottom;animation:eq 1s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="440" fill="url(#bg)"/>
<rect width="1200" height="440" fill="url(#dots)"/>
<g filter="url(#blur)" opacity=".8">
<circle class="blob" cx="300" cy="40" r="200" fill="#8b6cff" opacity=".45"/>
<circle class="blob" cx="1000" cy="420" r="200" fill="#ff9a8b" opacity=".35" style="animation-delay:-7s"/>
<circle class="blob" cx="760" cy="40" r="140" fill="#4c8dff" opacity=".3" style="animation-delay:-12s"/>
</g>
<g class="in" style="animation-delay:.1s"><text x="66" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#ff9a8b">FOUNDER &amp; MAINTAINER</text></g>
<g class="in" style="animation-delay:.25s"><text x="62" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="-2.5" fill="url(#title)">Mumcord</text></g>
<g class="in" style="animation-delay:.4s"><text x="66" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="600" fill="#ffffff">Modern voice chat for any Mumble server.</text></g>
<g transform="translate(560 112)"><rect class="wave" x="0" y="-26" width="5" height="26" rx="2.5" fill="#ff9a8b" style="animation-delay:0.00s"/><rect class="wave" x="9" y="-30" width="5" height="30" rx="2.5" fill="#8b6cff" style="animation-delay:0.13s"/><rect class="wave" x="18" y="-34" width="5" height="34" rx="2.5" fill="#ff9a8b" style="animation-delay:0.26s"/><rect class="wave" x="27" y="-38" width="5" height="38" rx="2.5" fill="#8b6cff" style="animation-delay:0.39s"/><rect class="wave" x="36" y="-34" width="5" height="34" rx="2.5" fill="#ff9a8b" style="animation-delay:0.52s"/><rect class="wave" x="45" y="-30" width="5" height="30" rx="2.5" fill="#8b6cff" style="animation-delay:0.65s"/><rect class="wave" x="54" y="-26" width="5" height="26" rx="2.5" fill="#ff9a8b" style="animation-delay:0.78s"/></g>
<g class="in" style="animation-delay:.55s"><circle cx="74" cy="262" r="5" fill="#ff9a8b"/><text x="92" y="269" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#cfc8ef">Low-latency Mumble voice, push-to-talk on mouse buttons</text>
<circle cx="74" cy="298" r="5" fill="#ff9a8b"/><text x="92" y="305" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#cfc8ef">Text channels you can follow without joining</text>
<circle cx="74" cy="334" r="5" fill="#ff9a8b"/><text x="92" y="341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#cfc8ef">No telemetry, TLS always on, no server changes needed</text></g>
<g class="in" style="animation-delay:.75s"><rect x="66" y="366" width="66" height="33" rx="16.5" fill="#8b6cff" fill-opacity="0.12" stroke="#8b6cff" stroke-opacity=".45"/><text x="99" y="386" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Rust</text>
<rect x="142" y="366" width="75" height="33" rx="16.5" fill="#8b6cff" fill-opacity="0.12" stroke="#8b6cff" stroke-opacity=".45"/><text x="179" y="386" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Tauri</text>
<rect x="227" y="366" width="120" height="33" rx="16.5" fill="#8b6cff" fill-opacity="0.12" stroke="#8b6cff" stroke-opacity=".45"/><text x="286" y="386" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">TypeScript</text>
<rect x="356" y="366" width="102" height="33" rx="16.5" fill="#8b6cff" fill-opacity="0.12" stroke="#8b6cff" stroke-opacity=".45"/><text x="407" y="386" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">AGPL-3.0</text>
<rect x="468" y="366" width="200" height="33" rx="16.5" fill="#8b6cff" fill-opacity="0.12" stroke="#8b6cff" stroke-opacity=".45"/><text x="568" y="386" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Win / macOS / Linux</text></g>
<g class="float">
<g filter="url(#shadow)"><rect x="680" y="44" width="480" height="352" rx="16" fill="#100b20"/></g>
<g clip-path="url(#win)">
<rect x="680" y="44" width="480" height="34" fill="#0a0716"/>
<circle cx="700" cy="61" r="5.5" fill="#ff5f57"/><circle cx="718" cy="61" r="5.5" fill="#febc2e"/><circle cx="736" cy="61" r="5.5" fill="#28c840"/>
<text x="920.0" y="66" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6f6893">Mumcord</text>
